version: "3.9"

# SHAWN M1 — ISO 20022 Tokenization Container
# Image: ghcr.io/qvtxsm1/tokenizem1:latest
# Ref:   SM1-53686177-6e204d31

services:
  shawn-m1:
    image: ghcr.io/qvtxsm1/tokenizem1:latest
    container_name: shawn-m1
    restart: always
    ports:
      - "42881:42881"
    volumes:
      - shawn_ledger:/opt/shawn-m1/ledger
      - shawn_logs:/opt/shawn-m1/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:42881/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "qvtx.container=shawn-m1"
      - "qvtx.byteid=QVTX-53686177-6e204d31-1a1d2226-436f"
      - "qvtx.protocol=ISO-20022-pacs.008"

volumes:
  shawn_ledger:
    name: shawn_m1_ledger
  shawn_logs:
    name: shawn_m1_logs
